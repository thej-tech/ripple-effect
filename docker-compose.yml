services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:0.40.16
    environment:
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama-data:/root/.ollama
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  api:
    image: ripple-effect-api:local
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      APP_ENV: development
      ENABLE_LOCAL_AUTH: "true"
      SEED_DEMO_DATA: "${SEED_DEMO_DATA:-false}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://ollama:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:3b}"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6

  web:
    image: ripple-effect-web:local
    build:
      context: ./frontend
    environment:
      API_UPSTREAM_RESOLVE: resolve
      # Synthetic seeded "North Campus Demo" administrator (development only).
      RIPPLE_LOCAL_USER_ID: ${RIPPLE_LOCAL_USER_ID:-40f3a390-3e0b-5bf4-bb3b-aad260f8120a}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:8080"
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  postgres-data:
  ollama-data:
